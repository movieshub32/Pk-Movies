name: Build PK Movies Viewer APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-webapp.yml"
      - "icon.png"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create Android Project
        shell: bash
        run: |
          test -f icon.png || (echo "Repository root mein icon.png upload karein" && exit 1)

          mkdir -p app/src/main/java/com/pkmovies/webapp
          mkdir -p app/src/main/res/values

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            cp icon.png app/src/main/res/mipmap-$d/ic_launcher.png
          done

          cat > settings.gradle <<'EOF2'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PKMoviesViewer"
          include ':app'
          EOF2

          cat > build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF2

          cat > app/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pkmovies.webapp'
              compileSdk 35

              defaultConfig {
                  applicationId "pk.movies.viewer.web"
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName "1.2"
              }
          }
          EOF2

          cat > app/src/main/res/values/strings.xml <<'EOF2'
          <resources>
              <string name="app_name">PK MOVIES</string>
          </resources>
          EOF2

          cat > app/src/main/res/values/styles.xml <<'EOF2'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D6AD43</item>
                  <item name="android:statusBarColor">#101522</item>
                  <item name="android:navigationBarColor">#101522</item>
                  <item name="android:windowLightStatusBar">false</item>
          </style>
          </resources>
          EOF2

          cat > app/src/main/AndroidManifest.xml <<'EOF2'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2

          cat > app/src/main/java/com/pkmovies/webapp/MainActivity.java <<'EOF2'
          package com.pkmovies.webapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout fullscreenContainer;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private int previousOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(16,21,34));
                  getWindow().setNavigationBarColor(Color.rgb(16,21,34));

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(16,21,34));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadsImagesAutomatically(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (fullscreenView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          fullscreenView = view;
                          fullscreenCallback = callback;
                          previousOrientation = getRequestedOrientation();

                          webView.setVisibility(View.GONE);
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT
                          ));
                          setContentView(fullscreenContainer);

                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          Window w = getWindow();
                          w.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          w.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          exitFullscreen();
                      }
                  });

                  setContentView(webView);
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("https://movieshub32.github.io/Pk-Movies/");
                  }
              }

              private void exitFullscreen() {
                  if (fullscreenView == null) return;
                  fullscreenContainer.removeView(fullscreenView);
                  fullscreenView = null;
                  if (fullscreenCallback != null) {
                      fullscreenCallback.onCustomViewHidden();
                      fullscreenCallback = null;
                  }
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  setRequestedOrientation(previousOrientation);
                  setContentView(webView);
                  webView.setVisibility(View.VISIBLE);
              }

              @Override
              public void onBackPressed() {
                  if (fullscreenView != null) {
                      exitFullscreen();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      new AlertDialog.Builder(this)
                          .setTitle("Exit PK MOVIES?")
                          .setMessage("Do you want to exit the app?")
                          .setPositiveButton("YES", (dialog, which) -> finish())
                          .setNegativeButton("NO", (dialog, which) -> dialog.dismiss())
                          .show();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF2

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-MOVIES-VIEWER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
