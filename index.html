<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pk Movies</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============ TOKENS ============ */
        :root{
            --bg-0:#0a0a12;
            --bg-1:#11111c;
            --surface:#181826;
            --surface-2:#1f1f30;
            --border:#2a2a3d;
            --ember:#ff5b3d;
            --amber:#ffb238;
            --text:#f2f2f7;
            --text-dim:#9a9ab0;
            --success:#33d17a;
            --pink:#ff3d77;
            --radius:14px;
            --shadow-lg: 0 18px 40px rgba(0,0,0,.55);
        }

        *{ box-sizing:border-box; }

        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:var(--bg-0); }
        ::-webkit-scrollbar-thumb{ background:linear-gradient(var(--ember),var(--amber)); border-radius:10px; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(255,91,61,.10), transparent 60%),
                radial-gradient(900px 600px at 110% 10%, rgba(255,178,56,.08), transparent 60%),
                linear-gradient(180deg, var(--bg-0), var(--bg-1));
            color: var(--text);
            margin: 0;
            padding: 0 0 78px 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- HEADER --- */
        .header {
            background: rgba(10,10,18,.85);
            backdrop-filter: blur(14px);
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .menu-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--text);
            width: 38px; height: 38px;
            display:flex; align-items:center; justify-content:center;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: .2s;
        }
        .menu-btn:hover{ border-color: var(--ember); color: var(--ember); }

        .header h1 {
            margin: 0;
            font-family:'Poppins',sans-serif;
            background: linear-gradient(90deg, var(--ember), var(--amber));
            -webkit-background-clip: text;
            color: transparent;
            font-size: 22px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: .3px;
        }

        #searchBar {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background-color: var(--surface);
            color: var(--text);
            width: 150px;
            outline: none;
            font-family:'Inter',sans-serif;
            font-size: 13px;
            transition: all 0.25s;
        }
        #searchBar::placeholder{ color: var(--text-dim); }
        #searchBar:focus {
            width: 200px;
            border-color: var(--ember);
            box-shadow: 0 0 0 3px rgba(255,91,61,.15);
        }

        /* --- SIDEBAR MENU --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: -290px;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, var(--surface), var(--bg-0));
            box-shadow: 2px 0 30px rgba(0,0,0,.6);
            border-right: 1px solid var(--border);
            z-index: 2000;
            transition: left 0.32s cubic-bezier(.4,0,.2,1);
            padding-top: 65px;
            display: flex;
            flex-direction: column;
        }
        #sideMenu.active { left: 0; }
        .side-menu-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 30px;
            cursor: pointer;
            color: var(--ember);
            width:38px; height:38px;
            display:flex; align-items:center; justify-content:center;
            border-radius:10px;
            transition:.2s;
        }
        .side-menu-close:hover{ background: rgba(255,91,61,.12); }
        .side-link {
            padding: 15px 24px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            transition: 0.2s;
            cursor: pointer;
        }
        .side-link i{ width: 20px; text-align: center; }
        .side-link:hover {
            background: rgba(255,91,61,.08);
            color: var(--amber);
            padding-left: 30px;
        }
        .side-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(2px);
            z-index: 1900;
            display: none;
        }
        .side-overlay.active { display: block; }

        /* --- MOVIE GRID --- */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 18px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 600px;
        }

        @media (min-width: 768px) {
            .movie-grid { grid-template-columns: repeat(4, 1fr); gap: 22px; padding: 22px; }
        }
        @media (min-width: 1024px) {
            .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; }
        }
        @media (max-width: 600px) {
            #searchBar { width: 115px; }
            .header h1 { font-size: 19px; }
        }

        .movie-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .25s, box-shadow .25s, border-color .25s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 16px rgba(0,0,0,.4);
            border: 1px solid var(--border);
        }
        .movie-card:hover {
            transform: translateY(-6px);
            border-color: var(--ember);
            box-shadow: var(--shadow-lg);
        }
        .movie-card:active { transform: scale(0.97); }

        .movie-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background-color: #000;
            display:block;
        }

        .movie-card p {
            padding: 10px 10px 2px 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            font-family:'Inter',sans-serif;
            color: var(--text);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-badge {
            color: var(--amber);
            padding: 0 10px 10px 10px;
            font-size: 10.5px;
            font-weight: 700;
            display: block;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        /* --- PAGINATION & SPINNER --- */
        .pagination-controls { display: flex; justify-content: center; gap: 16px; padding: 10px 20px 30px; }
        .page-btn {
            background: linear-gradient(135deg, var(--ember), var(--amber));
            color: #160a05;
            padding: 11px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 8px 18px rgba(255,91,61,.25);
            transition: .2s;
        }
        .page-btn:hover{ filter: brightness(1.08); }
        .page-btn:disabled { background: var(--surface-2); color: #777; cursor: not-allowed; box-shadow:none; }

        #loadingSpinner { display: none; text-align: center; padding: 60px; }
        .spinner {
            border: 4px solid var(--surface-2);
            border-top: 4px solid var(--ember);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 0.9s linear infinite;
            margin: 18px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingSpinner p{ color: var(--text-dim); font-size: 13px; letter-spacing:.3px; }

        /* --- MODALS --- */
        .movie-detail, .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5,5,10,0.88);
            backdrop-filter: blur(8px);
            padding: 20px;
            overflow-y: auto;
            z-index: 3000;
        }

        .detail-content, .modal-box {
            max-width: 600px;
            margin: 40px auto;
            background: var(--surface);
            padding: 22px;
            border-radius: 18px;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,.7);
        }

        .close-btn-fixed {
            position: absolute;
            top: -44px;
            right: 0;
            font-size: 34px;
            line-height: 34px;
            width:40px; height:40px;
            display:flex; align-items:center; justify-content:center;
            color: #fff;
            background: rgba(255,91,61,.18);
            border: 1px solid var(--ember);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            transition:.2s;
        }
        .close-btn-fixed:hover{ background: var(--ember); }

        #inModalPlayerContainer {
            width: 100%;
            background: #000;
            margin-bottom: 14px;
            display: none;
            position: relative;
            padding: 30px 0;
            border-radius: 12px;
            overflow: hidden;
        }

        #inModalPlayerContainer.drive-mode, #inModalPlayerContainer.embed-mode { padding: 0 !important; }

        #drivePlayer, #embedPlayer {
            width: 100%;
            height: 250px;
            border: none;
            display: block;
        }

        @media (min-width: 768px) {
            #drivePlayer, #embedPlayer { height: 350px; }
        }

        #inModalVideoPlayer { width: 100%; height: auto; max-height: 350px; border-radius: 12px; }

        .detail-content img { width: 100%; border-radius: 12px; margin-bottom: 14px; display:block; }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--amber), var(--ember));
            color: #160a05;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: filter .2s, transform .15s;
        }
        .btn:hover{ filter: brightness(1.06); }
        .btn:active{ transform: scale(0.98); }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 13px; }
        .form-input, .form-select {
            width: 100%; padding: 11px; background: var(--bg-0); border: 1px solid var(--border);
            color: white; border-radius: 8px; box-sizing: border-box; font-family:'Inter',sans-serif;
        }
        .form-input:focus, .form-select:focus{ outline:none; border-color: var(--ember); }

        /* --- BOTTOM NAV --- */
        #bottomNav {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            height: 64px;
            background: rgba(15,15,24,.92);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border-top: 1px solid var(--border);
        }
        .nav-item-btn {
            color: var(--text-dim);
            text-align: center;
            cursor: pointer;
            padding: 6px;
            flex-grow: 1;
            transition: .2s;
        }
        .nav-item-btn.active { color: var(--amber); transform: scale(1.07); }
        .nav-item-btn i { font-size: 18px; display: block; margin-bottom: 3px; }
        .nav-item-btn span { font-size: 10px; font-weight: 700; letter-spacing:.3px; }

        /* Categories Overlay */
        #categoryListOverlay {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 6px;
        }
        @media (min-width: 768px) {
            #categoryListOverlay { grid-template-columns: repeat(4, 1fr); }
        }
        .category-btn-item {
            background: var(--surface-2);
            color: #fff;
            padding: 13px 8px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-btn-item:hover {
            background: linear-gradient(135deg, var(--ember), var(--amber));
            color: #160a05;
            border-color: transparent;
        }

        /* Episode List */
        .episode-item {
            display: flex; justify-content: space-between; align-items:center;
            padding: 11px 12px; border: 1px solid var(--border); background: var(--surface-2);
            margin-bottom: 7px; border-radius: 8px; font-size: 13px;
        }
        .ep-actions button {
            margin-left: 6px; padding: 6px 12px; border: none; border-radius: 6px;
            cursor: pointer; color: #fff; font-size: 12px; font-weight: 600; transition:.2s;
        }
        .ep-play { background: #00b8d4; }
        .ep-play:hover{ background:#00d4f5; }
        .ep-down { background: var(--success); }
        .ep-down:hover{ background:#3fe88f; }

        /* Ad Pop-up */
        #adPopup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 10000; }
        #adIframeContainer { width: 90%; height: 80%; position: relative; }
        #adIframe { width: 100%; height: 100%; border: none; border-radius: 10px; }
        #adTimer {
            position: absolute; top: -36px; right: 0; color: white; font-size: 15px; font-weight: 700;
            background: var(--surface); padding: 6px 14px; border-radius: 999px; border:1px solid var(--border);
        }

        /* Episode Grouping */
        .ep-group-btn {
            background: var(--surface-2);
            color: #fff;
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid var(--border);
            text-align: left;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            transition:.2s;
        }
        .ep-group-content {
            display: none;
            background: var(--bg-0);
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .ep-group-btn.active {
            background: linear-gradient(135deg, var(--amber), var(--ember));
            color: #160a05;
            border-color: transparent;
        }

        .no-scroll { overflow: hidden; }

        h2#modalTitle{ font-family:'Poppins',sans-serif; font-size:19px; margin: 4px 0; }
    </style>
</head>

<body>

<div class="side-overlay" onclick="toggleSideMenu()"></div>
<div id="sideMenu">
    <div class="side-menu-close" onclick="toggleSideMenu()">&times;</div>
    <div style="padding: 0 24px 18px 24px;">
        <h2 style="color: var(--amber); border-bottom: 1px solid var(--border); padding-bottom: 12px; font-family:'Poppins',sans-serif; font-size:19px;">Menu</h2>
    </div>

    <div class="side-link" onclick="handleNavClick('popular', null); toggleSideMenu()">
        <i class="fas fa-star" style="color: gold;"></i> Popular Content

    </div>

    <div class="side-link" onclick="handleNavClick('Turkish Dramas', null); toggleSideMenu()">
        <i class="fas fa-mosque" style="color: #03a9f4;"></i> Turkish Dramas
    </div>

    <div class="side-link" onclick="openRequestModal(); toggleSideMenu()">
        <i class="fas fa-envelope-open-text" style="color: #00e676;"></i> Request Movie
    </div>

    <div class="side-link" onclick="window.location.reload()">
        <i class="fas fa-sync" style="color: #29b6f6;"></i> Refresh App
    </div>
</div>

<div class="header" id="pageHeader">
    <div class="header-left">
        <i class="fas fa-bars menu-btn" onclick="toggleSideMenu()"></i>
        <h1 onclick="window.location.reload()">Pk Movies</h1>
    </div>
    <input type="text" id="searchBar" onkeyup="debounceFilter()" placeholder="Search...">
</div>

<div id="loadingSpinner">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<div id="movieGrid" class="movie-grid"></div>

<div class="pagination-controls">
    <button id="prevBtn" class="page-btn" onclick="goToPage(-1)">Previous</button>
    <button id="nextBtn" class="page-btn" onclick="goToPage(1)">Next</button>
</div>

<div id="modal" class="movie-detail">
    <div class="detail-content">
        <div class="close-btn-fixed" onclick="closeDetail()">&times;</div>

        <div id="inModalPlayerContainer">
            <div id="embedLoader" style="display:none; text-align:center; padding: 40px 0;">
                <div class="spinner" style="width:28px; height:28px; margin-bottom: 10px;"></div>
                <p style="font-size: 12px; color: var(--amber); margin:0;">Please Wait....</p>
            </div>

            <video id="inModalVideoPlayer" controls controlsList="" playsinline preload="metadata">
                <source id="inModalVideoSource" src="">
            </video>

            <iframe id="drivePlayer" src="" style="display:none;" allow="autoplay; fullscreen" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

            <iframe id="embedPlayer" src="" style="display:none;" scrolling="no" frameborder="0" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

            <button id="driveDownloadBtn" class="btn" style="background: #2196F3; color: white; display: none; margin-top: 5px; font-size: 12px; padding: 8px;">
                <i class="fas fa-download"></i> Full Watch & Download
            </button>
        </div>

        <div id="playbackInfo" style="color: #00d4f5; font-size: 13px; text-align: center; margin-bottom: 14px; font-weight: 700; display: none;"></div>

        <img id="modalImg" src="">
        <h2 id="modalTitle"></h2>
        <div style="margin: 8px 0 12px; color: var(--amber); font-size: 13px; font-weight:600;">
            <span id="modalRating"></span> &nbsp;|&nbsp; <span id="modalYear"></span>
        </div>
        <p id="modalDesc" style="font-size: 13px; color: var(--text-dim); line-height: 1.55;"></p>

        <div id="seriesEpisodeContainer" style="display: none; margin-top: 16px;">
             <select id="seasonSelect" onchange="displaySeasonEpisodes(this.value)" class="form-select" style="margin-bottom: 12px;"></select>
             <div id="episodeList"></div>
        </div>

        <div id="movieButtons">
            <button id="playBtn" class="btn" style="background: linear-gradient(135deg,#ff5b3d,#ff8c1a); color: #160a05;">Play Movie</button>
            <button id="favoriteBtn" class="btn" style="background: linear-gradient(135deg,#ff3d77,#ff5b3d); color: #fff;">Add to Favorites</button>
            <button id="otherDownloadBtn" class="btn" style="background: #009688; color: white; display: none;">Alternative Download</button>
        </div>
    </div>
</div>

<div id="requestModal" class="modal-overlay">
    <div class="modal-box">
        <div class="close-btn-fixed" onclick="document.getElementById('requestModal').style.display='none'">&times;</div>
        <h2 style="color: #00e676; text-align: center; font-family:'Poppins',sans-serif;">Request Content</h2>
        <p style="text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 22px;">Let us know what you want to watch!</p>

        <div class="form-group">
            <label class="form-label">Type:</label>
            <select id="reqType" class="form-select">
                <option value="Movie">Movie</option>
                <option value="Series">Web Series</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Name:</label>
            <input type="text" id="reqName" class="form-input" placeholder="e.g. Pathaan, Money Heist...">
        </div>

        <button class="btn" onclick="submitRequest()" style="background: linear-gradient(135deg,#00e676,#00bfa5); color: #062a1c;">Send Request</button>
    </div>
</div>

<div id="categoriesOverlay" class="modal-overlay">
    <div class="modal-box">
        <div class="close-btn-fixed" onclick="closeCategoriesOverlay()">&times;</div>
        <h2 style="text-align: center; color: var(--amber); font-family:'Poppins',sans-serif;">Select Category</h2>
        <div id="categoryListOverlay"></div>
    </div>
</div>

<div id="adPopup">
    <div id="adIframeContainer">
        <div id="adTimer">10</div>
        <iframe id="adIframe" src=""></iframe>
    </div>
</div>

<div id="bottomNav">
    <div class="nav-item-btn active" onclick="window.location.reload()">
        <i class="fas fa-home"></i> <span>Home</span>
    </div>
    <div class="nav-item-btn" onclick="showCategoriesOverlay()">
        <i class="fas fa-tags"></i> <span>Categories</span>
    </div>
    <div class="nav-item-btn" onclick="handleNavClick('movie', this)">
        <i class="fas fa-film"></i> <span>Movies</span>
    </div>
    <div class="nav-item-btn" onclick="handleNavClick('series', this)">
        <i class="fas fa-tv"></i> <span>Series</span>
    </div>
    <div class="nav-item-btn" onclick="handleNavClick('favorites', this)">
        <i class="fas fa-heart"></i> <span>Favorites</span>
    </div>
</div>

      ];

    window.onload = function() {
        loadData();
        setupVideoEvents();
        setTimeout(() => { showAdPopup(null, 0); }, 10000);
    };

    async function loadData() {
        spinner.style.display = 'block';

        database.ref('movies').on('value', (moviesSnap) => {
            allContent = [];
            moviesSnap.forEach(child => {
                let val = child.val();
                val.key = child.key;
                val.type = val.type || (val.episodes ? 'series' : 'movie');
                if(!val.isPopular) allContent.push(val);
            });
            allContent.reverse();
            refreshDisplay();
        });

        database.ref('popular_movies').on('value', (popularSnap) => {
            popularContent = [];
            popularSnap.forEach(child => {
                let val = child.val();
                val.key = child.key;
                val.isPopular = true;
                val.type = val.type || 'movie';
                popularContent.push(val);
            });
            popularContent.reverse();
            refreshDisplay();
        });
    }

    function refreshDisplay() {
        setFilter(currentFilterType);
        spinner.style.display = 'none';
    }

    function handleNavClick(filter, element) {
        if(element) {
            document.querySelectorAll('.nav-item-btn').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
        spinner.style.display = 'block';
        grid.innerHTML = '';
        document.getElementById("searchBar").value = '';
        closeDetail();
        setTimeout(() => {
            setFilter(filter);
            spinner.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 300);
    }

    function setFilter(filter) {
        currentFilterType = filter;
        if (filter === 'all') {
            filteredMovies = [...allContent, ...popularContent];
        } else if (filter === 'movie') {
            filteredMovies = allContent.filter(m => m.type === 'movie');
        } else if (filter === 'series') {
            filteredMovies = allContent.filter(m => m.type === 'series');
        } else if (filter === 'popular') {
            filteredMovies = popularContent;
        } else if (filter === 'favorites') {
            const favKeys = JSON.parse(localStorage.getItem('favs') || '[]');
            filteredMovies = [...allContent, ...popularContent].filter(m => favKeys.includes(m.key));
        } else {
            filteredMovies = [...allContent, ...popularContent].filter(m => m.category === filter);
        }
        currentPage = 1;
        renderPage(currentPage);
    }

    function renderPage(page) {
        const start = (page - 1) * MOVIES_PER_PAGE;
        const end = start + MOVIES_PER_PAGE;
        const pageItems = filteredMovies.slice(start, end);
        const totalPages = Math.ceil(filteredMovies.length / MOVIES_PER_PAGE);
        if (pageItems.length === 0) {
            grid.innerHTML = `<p style="text-align: center; grid-column: 1/-1; padding: 30px; color: var(--text-dim);">No content found.</p>`;
            paginationControls.style.display = 'none';
            return;
        }
        let htmlBuffer = '';
        pageItems.forEach(movie => {
            const tag = movie.isPopular ? 'Popular' : (movie.type === 'series' ? 'Series' : 'Movie');
            htmlBuffer += `<div class="movie-card" onclick="openDetail('${movie.key}')">
                    <img src="${movie.img}" loading="lazy" alt="${movie.title}">
                    <p>${movie.title}</p>
                    <span class="category-badge">${movie.category} | ${tag}</span>
                </div>`;
        });
        grid.innerHTML = htmlBuffer;
        paginationControls.style.display = totalPages > 1 ? 'flex' : 'none';
        document.getElementById("prevBtn").disabled = page === 1;
        document.getElementById("nextBtn").disabled = page >= totalPages;
    }

    function goToPage(dir) {
        currentPage += dir;
        renderPage(currentPage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let searchTimeout;
    function debounceFilter() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const q = document.getElementById("searchBar").value.toUpperCase();
            if(!q) return setFilter('all');
            filteredMovies = [...allContent, ...popularContent].filter(m => m.title.toUpperCase().includes(q));
            currentPage = 1;
            renderPage(1);
        }, 500);
    }

    function openDetail(key) {
        const movie = [...allContent, ...popularContent].find(m => m.key === key);
        if(!movie) return;

        currentDetailData = movie;
        currentDetailMovieKey = key;

        document.getElementById("modalImg").src = movie.img;
        document.getElementById("modalTitle").innerText = movie.title;
        document.getElementById("modalDesc").innerText = movie.genres || '';
        document.getElementById("modalRating").innerText = `⭐ ${movie.rating || 'N/A'}`;
        document.getElementById("modalYear").innerText = movie.year || '';

        const playerContainer = document.getElementById("inModalPlayerContainer");
        const playBtn = document.getElementById("playBtn");
        const otherBtn = document.getElementById("otherDownloadBtn");
        const seriesContainer = document.getElementById("seriesEpisodeContainer");
        const favBtn = document.getElementById("favoriteBtn");

        playerContainer.style.display = 'none';
        videoPlayer.pause();
        videoPlayer.src = '';
        drivePlayer.src = '';
        embedPlayer.src = '';
        videoPlayer.style.display = 'none';
        drivePlayer.style.display = 'none';
        embedPlayer.style.display = 'none';
        embedLoader.style.display = 'none';
        driveDownloadBtn.style.display = 'none';
        document.getElementById("playbackInfo").style.display = 'none';

        updateFavBtnState(key);
        favBtn.onclick = () => toggleFavorite(key);

        otherBtn.style.display = 'block';
        otherBtn.innerText = "Alternative Download";
        otherBtn.onclick = () => {
            if(movie.otherDownloadLink) {
                window.open(movie.otherDownloadLink, '_blank');
            } else {
                alert("Download link not available");
            }
        };

        if(movie.type === 'series') {
            playBtn.style.display = 'none';
            seriesContainer.style.display = 'block';
            const seasonSelect = document.getElementById("seasonSelect");
            seasonSelect.innerHTML = '';
            const count = movie.seasons || 1;
            for(let i=1; i<=count; i++) {
                const opt = document.createElement("option");
                opt.value = `S${i}`;
                opt.innerText = `Season ${i}`;
                seasonSelect.appendChild(opt);
            }
            displaySeasonEpisodes('S1');
        } else {
            playBtn.style.display = 'block';
            seriesContainer.style.display = 'none';
            playBtn.onclick = () => playVideo(movie.play, key, movie.title);
        }
        document.getElementById("modal").style.display = "block";
        document.body.classList.add("no-scroll");
    }

    function closeDetail() {
        const modal = document.getElementById("modal");
        if (currentPlaybackID && !videoPlayer.ended && videoPlayer.currentTime > 0) {
            localStorage.setItem(`playback_${currentPlaybackID}`, videoPlayer.currentTime.toString());
        }
        videoPlayer.pause();
        videoPlayer.src = '';
        drivePlayer.src = '';
        embedPlayer.src = '';
        embedLoader.style.display = 'none';
        document.getElementById("inModalPlayerContainer").style.display = 'none';
        currentPlaybackID = null;
        modal.style.display = "none";
        document.body.classList.remove("no-scroll");
    }

    function playVideo(url, playbackID, seriesTitle = 'Movie', season = '', episodeTitle = '') {
        if(!url) return alert("Link is not available");
        const container = document.getElementById("inModalPlayerContainer");
        const infoDiv = document.getElementById("playbackInfo");

        container.style.display = 'block';
        currentPlaybackID = playbackID;

        videoPlayer.style.display = 'none';
        drivePlayer.style.display = 'none';
        embedPlayer.style.display = 'none';
        embedLoader.style.display = 'none';
        driveDownloadBtn.style.display = 'none';

        // --- Streamtape Link Fix ---
        if (url.includes('streamtape.to/v/')) {
            url = url.replace('streamtape.to/v/', 'streamtape.to/e/');
        }

        // --- Google Drive or Embed Players ---
        if (url.includes('drive.google.com')) {
            container.classList.add('drive-mode');
            let embedUrl = url.replace('/view', '/preview').replace('/edit', '/preview');
            videoPlayer.pause();
            embedLoader.style.display = 'block';
            drivePlayer.src = embedUrl;
            drivePlayer.onload = () => { embedLoader.style.display = 'none'; drivePlayer.style.display = 'block'; };
            driveDownloadBtn.style.display = 'block';
            driveDownloadBtn.onclick = () => window.open(url.replace('/preview', '/view'), '_blank');
        }
        else if (url.includes('dailymotion.com') || url.includes('streamtape.to') || url.includes('vidmoly') || url.includes('embed')) {
            container.classList.add('embed-mode');
            videoPlayer.pause();
            embedLoader.style.display = 'block';
            embedPlayer.src = url;
            embedPlayer.onload = () => { embedLoader.style.display = 'none'; embedPlayer.style.display = 'block'; };
        }
        // --- HTML5 Video Player ---
        else {
            container.classList.remove('drive-mode');
            videoPlayer.style.display = 'block';
            videoPlayer.src = url;
            videoPlayer.load();

            const savedTime = localStorage.getItem(`playback_${playbackID}`);

            videoPlayer.onloadedmetadata = function() {
                if (savedTime) {
                    videoPlayer.currentTime = parseFloat(savedTime);
                }
                videoPlayer.play().catch(e => console.log("Manual play required"));
            };
        }

        if (seriesTitle !== 'Movie' && season && episodeTitle) {
            infoDiv.innerText = `S${season.slice(1)} - ${episodeTitle}`;
        } else {
            infoDiv.innerText = seriesTitle;
        }
        infoDiv.style.display = 'block';
        document.getElementById("modal").scrollTo({ top: 0, behavior: 'smooth' });
    }


    function setupVideoEvents() {
        let saveTimeout;
        videoPlayer.ontimeupdate = function() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                if (currentPlaybackID && !videoPlayer.paused && !videoPlayer.ended && videoPlayer.currentTime > 5) {
                    localStorage.setItem(`playback_${currentPlaybackID}`, videoPlayer.currentTime.toString());
                }
            }, 2000);
        };
        videoPlayer.onpause = () => {
            if (currentPlaybackID && !videoPlayer.ended) localStorage.setItem(`playback_${currentPlaybackID}`, videoPlayer.currentTime.toString());
        };
        videoPlayer.onended = () => {
            if (currentPlaybackID) localStorage.removeItem(`playback_${currentPlaybackID}`);
        };
    }

    function displaySeasonEpisodes(season) {
        const list = document.getElementById("episodeList");
        list.innerHTML = `<div style="text-align: center; padding: 24px;"><div class="spinner" style="width:28px;height:28px;border-width:3px;"></div></div>`;

        setTimeout(() => {
            list.innerHTML = '';
            if(!currentDetailData.episodes || !currentDetailData.episodes[season]) {
                list.innerHTML = '<p style="color:#888; text-align:center;">No episodes added yet.</p>';
                return;
            }

            const eps = currentDetailData.episodes[season];
            const seriesTitle = currentDetailData.title.replace(/'/g, "\\'");
            const epKeys = Object.keys(eps).sort((a,b) => parseInt(a.slice(3)) - parseInt(b.slice(3)));
            const totalEpisodes = epKeys.length;

            if (totalEpisodes <= 12) {
                renderEpisodeItems(list, epKeys, eps, season, seriesTitle);
            }
            else {
                for (let i = 0; i < totalEpisodes; i += 12) {
                    const rangeKeys = epKeys.slice(i, i + 12);
                    const startNum = i + 1;
                    const endNum = Math.min(i + 12, totalEpisodes);

                    const groupBtn = document.createElement("button");
                    groupBtn.className = "ep-group-btn";
                    groupBtn.innerHTML = `<span>Episode ${startNum < 10 ? '0'+startNum : startNum}-${endNum < 10 ? '0'+endNum : endNum}</span> <i class="fas fa-chevron-down"></i>`;

                    const groupContent = document.createElement("div");
                    groupContent.className = "ep-group-content";
                    groupContent.style.display = "none";

                    renderEpisodeItems(groupContent, rangeKeys, eps, season, seriesTitle);

                    groupBtn.onclick = function() {
                        const isOpen = this.nextElementSibling.style.display === "block";

                        document.querySelectorAll('.ep-group-content').forEach(el => el.style.display = 'none');
                        document.querySelectorAll('.ep-group-btn').forEach(el => {
                            el.classList.remove('active');
                            el.querySelector('i').className = 'fas fa-chevron-down';
                        });

                        if (!isOpen) {
                            this.classList.add("active");
                            this.nextElementSibling.style.display = "block";
                            this.querySelector("i").className = 'fas fa-chevron-up';
                        }
                    };

                    list.appendChild(groupBtn);
                    list.appendChild(groupContent);
                }
            }
        }, 800);
    }

    // ایپیسوڈز رینڈر کرنے کا فنکشن
    function renderEpisodeItems(container, keys, eps, season, seriesTitle) {
        keys.forEach(key => {
            const ep = eps[key];
            const playbackID = `${currentDetailMovieKey}_${season}_${key}`;
            container.innerHTML += `<div class="episode-item">
                <span>${ep.title}</span>
                <div class="ep-actions">
                    <button class="ep-play" onclick="playVideo('${ep.link}', '${playbackID}', '${seriesTitle}', '${season}', '${ep.title.replace(/'/g, "\\ text-align: left;")}')">Play</button>
                    <button class="ep-down" onclick="window.open('${ep.link}', '_blank')">Download</button>
           </div>
            </div>`;
        });
    }



    function toggleSideMenu() {
        document.getElementById("sideMenu").classList.toggle("active");
        document.querySelector(".side-overlay").classList.toggle("active");
    }

    function openRequestModal() { document.getElementById("requestModal").style.display = 'flex'; }

    function submitRequest() {
        const type = document.getElementById("reqType").value;
        const name = document.getElementById("reqName").value.trim();
        if(!name) return alert("Please enter a name");
        database.ref('requests').push({ type, name, timestamp: Date.now() }).then(() => {
            alert("Request sent!");
            document.getElementById("requestModal").style.display = 'none';
        });
    }

    function toggleFavorite(key) {
        let favs = JSON.parse(localStorage.getItem('favs') || '[]');
        favs = favs.includes(key) ? favs.filter(k => k !== key) : [...favs, key];
        localStorage.setItem('favs', JSON.stringify(favs));
        updateFavBtnState(key);
    }

    function updateFavBtnState(key) {
        const favs = JSON.parse(localStorage.getItem('favs') || '[]');
        const btn = document.getElementById("favoriteBtn");
        btn.innerText = favs.includes(key) ? "Saved to Favorites" : "Add to Favorites";
        btn.style.background = favs.includes(key) ? "linear-gradient(135deg,#33d17a,#1fae5e)" : "linear-gradient(135deg,#ff3d77,#ff5b3d)";
    }

    function showCategoriesOverlay() {
        document.getElementById("categoriesOverlay").style.display = 'flex';
        const list = document.getElementById("categoryListOverlay");
        database.ref('categories').once('value', snap => {
            list.innerHTML = '';
            snap.forEach(c => {
                const div = document.createElement("div");
                div.className = "category-btn-item";
                div.innerText = c.val();
                div.onclick = () => { handleNavClick(c.val(), null); closeCategoriesOverlay(); };
                list.appendChild(div);
            });
        });
    }

    function closeCategoriesOverlay() { document.getElementById("categoriesOverlay").style.display = 'none'; }

    function showAdPopup(url, time, redirectUrl = null) {
        const adDiv = document.getElementById("adPopup");
        const iframe = document.getElementById("adIframe");
        const timerEl = document.getElementById("adTimer");

        let finalAdUrl = (url && url.length > 5) ? url : adLinks[Math.floor(Math.random() * adLinks.length)];

        adDiv.style.display = 'flex';
        iframe.src = finalAdUrl;

        let timeLeft = time;
        timerEl.innerText = timeLeft;

        const interval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(interval);
                adDiv.style.display = 'none';
                iframe.src = '';
                if(redirectUrl) {
                    window.open(redirectUrl, '_blank');
                }
            }
        }, 1000);
    }
